[project]
name = "osiris-toolkit"
version = "0.16.0"
description = "Comprehensive toolkit for OSIRIS PIC simulation: input deck parsing, data extraction, unit conversion, analysis, and visualization"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
    { name = "pigskyerfish" }
]
keywords = [
    "osiris",
    "pic",
    "particle-in-cell",
    "plasma",
    "simulation",
    "zdf",
    "physics",
    "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/wulnkkk/osiris-toolkit"
Repository = "https://github.com/wulnkkk/osiris-toolkit"
Issues = "https://github.com/wulnkkk/osiris-toolkit/issues"

[project.optional-dependencies]
vtk = ["pyevtk>=1.6"]
hdf5 = ["h5py>=3.0"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "commitizen>=3.29",
]

[project.scripts]
osiris-toolkit = "osiris_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osiris_toolkit"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["src/osiris_toolkit/_generated/"]
extend-exclude = ["docs/", "dev-tools/", "examples/"]
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming (exceptions below)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "RUF",  # Ruff-specific rules
    "ARG",  # unused arguments
    "SIM",  # simplify expressions
]
ignore = [
    "N999",  # Allow non-PEP8 names in specific cases
    "B904",  # `raise` without `from` — context preserved by library design
]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (excluded from CI by default)",
    "data: marks tests requiring real ZDF simulation data",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# NOTE: Many pre-existing type errors exist. Relaxed checks allow incremental fixes.
strict_optional = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = false
exclude = ["_generated/", "tests/hpc/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Pre-existing type issues — ALL RESOLVED as of this commit.
# The override block below is kept as reference only and can be removed
# once no other branches need it.
# [[tool.mypy.overrides]]
# module = [
#     ...
# ]
# ignore_errors = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.16.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"

# During 0.x.y (initial development), breaking changes increment MINOR not MAJOR.
# When ready to release 1.0.0, remove this [bump_map] section to restore default
# behavior where BREAKING CHANGE increments MAJOR.
[tool.commitizen.bump_map]
"BREAKING CHANGE" = "MINOR"
feat = "MINOR"
fix = "PATCH"
