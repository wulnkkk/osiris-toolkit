[project]
name = "osiris-toolkit"
version = "0.1.0"
description = "Comprehensive toolkit for OSIRIS PIC simulation: input deck parsing, data extraction, unit conversion, analysis, and visualization"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
    { name = "pigskyerfish" }
]
keywords = [
    "osiris",
    "pic",
    "particle-in-cell",
    "plasma",
    "simulation",
    "zdf",
    "physics",
    "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/wulnkkk/osiris-toolkit"
Repository = "https://github.com/wulnkkk/osiris-toolkit"
Issues = "https://github.com/wulnkkk/osiris-toolkit/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[project.scripts]
osiris-toolkit = "osiris_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osiris_toolkit"]

[tool.ruff]
line-length = 120
exclude = ["src/osiris_toolkit/_generated/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["N"]  # ZDF naming follows upstream Fortran conventions

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
