# See https://pre-commit.com for documentation
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - numpy>=1.20
          - types-PyYAML>=6.0
        args: [--config-file=pyproject.toml]
        # mypy on the full project can be heavy; run only on staged changes
        pass_filenames: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.31.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: check-arch
        name: Architecture dependency check
        entry: uv run python dev-tools/check_arch.py
        language: system
        pass_filenames: false
        files: ^src/osiris_toolkit/

      - id: check-english
        name: English language check
        entry: uv run python dev-tools/check_english.py
        language: system
        pass_filenames: false

      - id: check-docs-sync
        name: Documentation sync check
        entry: uv run python dev-tools/check_docs_sync.py
        language: system
        pass_filenames: false
        files: ^(docs/|skills/|mkdocs\.yml|AGENTS\.md)
