site_name: osiris-toolkit
site_description: Comprehensive Python toolkit for OSIRIS PIC simulations
repo_url: https://github.com/wulnkkk/osiris-toolkit
theme:
  name: material
  features:
    - navigation.tabs
    - search.highlight
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            heading_level: 2
            show_root_heading: true
exclude_docs: |
  note/
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Basic Workflow: getting-started/basic-workflow.md
  - User Guide:
      - Deck Parsing: user-guide/deck-parsing.md
      - Simulation Browsing: user-guide/simulation-browsing.md
      - Unit Conversion: user-guide/unit-conversion.md
      - Field Plotting: user-guide/field-plotting.md
      - K-Space Analysis: user-guide/kspace-analysis.md
      - Density Plotting: user-guide/density-plotting.md
      - Phasespace: user-guide/phasespace-plotting.md
      - Batch Processing: user-guide/batch-processing.md
      - Parallel Execution: user-guide/parallel-execution.md
      - CLI Reference: user-guide/cli-reference.md
  - API Reference:
      - sim: api/sim.md
      - units: api/units.md
      - compute: api/compute.md
      - analysis: api/analysis.md
      - vis: api/vis.md
      - io: api/io.md
      - deck: api/deck.md
      - exceptions: api/exceptions.md
      - workflow: api/workflow.md
      - resource: api/resource.md
  - Architecture:
      - Overview: architecture/overview.md
      - Dependency Hierarchy: architecture/dependency-hierarchy.md
      - Data Flow: architecture/data-flow.md
      - Unit Conversion: architecture/unit-conversion.md
      - K-Space Pipeline: architecture/k-space-pipeline.md
      - Vis Architecture: architecture/vis-architecture.md
  - Design:
      - Unit System: design/unit-system-architecture.md
      - Architecture Refactor v0.14: design/architecture-refactor.md
      - PostProcessor Design: design/postproc-architecture.md
  - Modules:
      - Deck: modules/deck.md
      - Simulation: modules/sim.md
      - Units: modules/units.md
      - IO: modules/io.md
      - Compute: modules/compute.md
      - Analysis: modules/analysis.md
      - Visualization: modules/vis.md
      - Workflow: modules/workflow.md
      - Parallel: modules/parallel.md
      - Resource: modules/resource.md
      - Sync: modules/sync.md
      - Data Models: modules/_models.md
      - Generated: modules/_generated.md
      - Exceptions: modules/exceptions.md
  - Agent:
      - User Guide:
          - Skill Manual: agent-user/skill.md
          - Task Map: agent-user/task-map.md
          - Recipes:
              - Discover Sims: agent-user/recipes/discover-sims.md
              - Batch K-Space: agent-user/recipes/batch-k-space.md
              - Compare Sims: agent-user/recipes/compare-two-sims.md
      - Developer Guide:
          - Dev Skill: agent-dev/dev-skill.md
          - Dev Task Map: agent-dev/dev-task-map.md
  - Changelog:
      - Summary: CHANGELOG.md
      - v0.15.0: devlog/0.15.0.md
      - v0.14.0: devlog/0.14.0.md
      - v0.13.0: devlog/0.13.0.md
