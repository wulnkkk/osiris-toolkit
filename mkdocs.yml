site_name: osiris-toolkit
site_description: Comprehensive Python toolkit for OSIRIS PIC simulations
repo_url: https://github.com/wulnkkk/osiris-toolkit
theme:
  name: material
  features:
    - navigation.tabs
    - search.highlight
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            heading_level: 2
            show_root_heading: true
exclude_docs: |
  note/
nav:
  - Home: index.md
  - Tutorials:
      - Installation: tutorials/installation.md
      - Quick Start: tutorials/quick-start.md
      - Basic Workflow: tutorials/basic-workflow.md
  - How-To:
      - Deck Parsing: how-to/deck-parsing.md
      - Simulation Browsing: how-to/simulation-browsing.md
      - Unit Conversion: how-to/unit-conversion.md
      - Field Plotting: how-to/field-plotting.md
      - K-Space Analysis: how-to/kspace-analysis.md
      - Density Plotting: how-to/density-plotting.md
      - Phasespace: how-to/phasespace-plotting.md
      - Batch Processing: how-to/batch-processing.md
      - Parallel Execution: how-to/parallel-execution.md
      - CLI Reference: how-to/cli-reference.md
  - Reference:
      - API:
          - sim: reference/api/sim.md
          - units: reference/api/units.md
          - compute: reference/api/compute.md
          - analysis: reference/api/analysis.md
          - vis: reference/api/vis.md
          - io: reference/api/io.md
          - deck: reference/api/deck.md
          - exceptions: reference/api/exceptions.md
          - workflow: reference/api/workflow.md
          - resource: reference/api/resource.md
      - Modules:
          - Deck: reference/modules/deck.md
          - Simulation: reference/modules/sim.md
          - Units: reference/modules/units.md
          - IO: reference/modules/io.md
          - Compute: reference/modules/compute.md
          - Analysis: reference/modules/analysis.md
          - Visualization: reference/modules/vis.md
          - Workflow: reference/modules/workflow.md
          - Parallel: reference/modules/parallel.md
          - Resource: reference/modules/resource.md
          - Sync: reference/modules/sync.md
          - Data Models: reference/modules/_models.md
          - Generated: reference/modules/_generated.md
          - Exceptions: reference/modules/exceptions.md
  - Explanation:
      - Architecture:
          - Overview: explanation/architecture/overview.md
          - Dependency Hierarchy: explanation/architecture/dependency-hierarchy.md
          - Data Flow: explanation/architecture/data-flow.md
          - Unit Conversion: explanation/architecture/unit-conversion.md
          - K-Space Pipeline: explanation/architecture/k-space-pipeline.md
          - Vis Architecture: explanation/architecture/vis-architecture.md
          - Template: explanation/architecture/_template.md
      - Design:
          - Unit System: explanation/design/unit-system-architecture.md
          - Architecture Refactor v0.14: explanation/design/architecture-refactor.md
          - PostProcessor Design: explanation/design/postproc-architecture.md
          - Doc System: explanation/design/doc-system-architecture.md
  - Meta:
      - Project Anatomy: meta/project-anatomy.md
      - Documentation Standards: meta/documentation-standards.md
      - Documentation Internals: meta/documentation-internals.md
  - Changelog:
      - Summary: CHANGELOG.md
      - v0.16.0: devlog/0.16.0.md
      - v0.15.0: devlog/0.15.0.md
      - v0.14.0: devlog/0.14.0.md
